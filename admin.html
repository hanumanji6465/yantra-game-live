<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yantra Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #008000; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 5px;}
        button.red { background-color: #d10000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;}
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Yantra Admin Panel</h1>

        <div class="grid">
            <!-- Result Declare Box -->
            <div class="card" style="border: 2px solid #008000;">
                <h2>🎯 Declare Result</h2>
                <label style="font-size: 14px; font-weight: bold; color: blue;">1. Date (Aaj ke liye khali chhod dein):</label>
                <input type="date" id="resDate">
                
                <label style="font-size: 14px; font-weight: bold; color: red; margin-top: 10px; display: block;">2. Time Select Karein (Jaroori Hai):</label>
                <input type="time" id="resTime" style="border: 2px solid red; font-size: 18px;">
                
                <label style="font-size: 14px; font-weight: bold; color: blue; margin-top: 10px; display: block;">3. Winning Numbers Dalein:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="nv" placeholder="NV (00-99)">
                    <input type="number" id="rr" placeholder="RR (00-99)">
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="ry" placeholder="RY (00-99)">
                    <input type="number" id="ch" placeholder="CH (00-99)">
                </div>
                <button onclick="submitResult()" style="margin-top: 15px;">📢 PUBLISH RESULT</button>
            </div>

            <!-- User Points Management -->
            <div class="card">
                <h2>💰 Manage User Points</h2>
                <input type="text" id="targetPhone" placeholder="User Phone Number">
                <input type="number" id="pointAmount" placeholder="Amount (Points)">
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="modifyPoints('add')">➕ Add Points</button>
                    <button class="red" onclick="modifyPoints('deduct')">➖ Deduct Points</button>
                </div>
            </div>
        </div>

        <!-- Pending Deposits -->
        <div class="card" style="margin-top: 20px;">
            <h2>📥 Pending Deposits (Add Money)</h2>
            <table id="depositTable">
                <tr><th>Phone</th><th>Amount</th><th>UTR</th><th>Action</th></tr>
            </table>
        </div>

        <!-- Pending Withdrawals -->
        <div class="card" style="margin-top: 20px;">
            <h2>📤 Pending Withdrawals</h2>
            <table id="withdrawTable">
                <tr><th>Phone</th><th>Amount</th><th>Bank Details</th><th>Action</th></tr>
            </table>
        </div>
        
        <!-- Live Bets -->
        <div class="card" style="margin-top: 20px;">
            <h2>📊 Live Board (Current Bets) <button onclick="loadLiveBets()" style="width:auto; padding:5px 15px; background:blue; float: right;">Refresh</button></h2>
            <pre id="liveBetsData" style="background:#222; color:#0f0; padding:10px; overflow:auto; max-height: 300px; border-radius: 5px;"></pre>
        </div>
    </div>

    <script>
        async function submitResult() {
            let dateVal = document.getElementById('resDate').value;
            let timeVal = document.getElementById('resTime').value;
            
            let finalDate = "";
            if(dateVal) {
                let parts = dateVal.split("-");
                finalDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            if(!timeVal) {
                alert("❌ Kripya Result ka Time zaroor select karein! (Jaise 09:30 ya 10:00)");
                return;
            }

            const data = {
                customDate: finalDate, customTime: timeVal,
                nv: document.getElementById('nv').value, rr: document.getElementById('rr').value,
                ry: document.getElementById('ry').value, ch: document.getElementById('ch').value
            };
            let res = await fetch('/api/admin/result', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            let ans = await res.json();
            alert(ans.message);
            
            if (ans.success) {
                document.getElementById('nv').value = ""; document.getElementById('rr').value = "";
                document.getElementById('ry').value = ""; document.getElementById('ch').value = "";
            }
        }

        async function modifyPoints(action) {
            const phone = document.getElementById('targetPhone').value;
            const points = document.getElementById('pointAmount').value;
            if(!phone || !points) return alert("Phone aur Points dono dalein!");
            
            let res = await fetch('/api/admin/modify-points', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ targetPhone: phone, points, action }) });
            let ans = await res.json();
            alert(ans.message);
        }

        async function loadLiveBets() {
            let res = await fetch('/api/admin/live-bets');
            let data = await res.json();
            document.getElementById('liveBetsData').innerText = JSON.stringify(data.liveData, null, 2);
        }

        async function loadPayments() {
            let resDep = await fetch('/api/admin/pending-deposits');
            let dataDep = await resDep.json();
            let tableDep = document.getElementById('depositTable');
            tableDep.innerHTML = "<tr><th>Phone</th><th>Amount</th><th>UTR</th><th>Action</th></tr>";
            dataDep.deposits.forEach(d => {
                tableDep.innerHTML += `<tr><td>${d.phone}</td><td style="color:green; font-weight:bold;">₹${d.amount}</td><td>${d.utr}</td>
                <td><button onclick="handleDep('${d._id}', 'Approved')" style="padding: 5px;">Approve</button> <button class="red" onclick="handleDep('${d._id}', 'Rejected')" style="padding: 5px;">Reject</button></td></tr>`;
            });

            let resWith = await fetch('/api/admin/pending-withdrawals');
            let dataWith = await resWith.json();
            let tableWith = document.getElementById('withdrawTable');
            tableWith.innerHTML = "<tr><th>Phone</th><th>Amount</th><th>Bank/UPI</th><th>Action</th></tr>";
            dataWith.withdrawals.forEach(w => {
                tableWith.innerHTML += `<tr><td>${w.phone}</td><td style="color:red; font-weight:bold;">₹${w.amount}</td><td>${w.bankDetails}</td>
                <td><button onclick="handleWith('${w._id}', 'Approved')" style="padding: 5px;">Approve</button> <button class="red" onclick="handleWith('${w._id}', 'Rejected')" style="padding: 5px;">Reject</button></td></tr>`;
            });
        }

        async function handleDep(id, action) {
            let res = await fetch('/api/admin/handle-deposit', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ depositId: id, action }) });
            alert((await res.json()).message); loadPayments();
        }
        async function handleWith(id, action) {
            let res = await fetch('/api/admin/handle-withdrawal', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ withdrawId: id, action }) });
            alert((await res.json()).message); loadPayments();
        }

        loadPayments(); loadLiveBets();
        setInterval(loadPayments, 10000); setInterval(loadLiveBets, 10000);
    </script>
</body>
</html>
